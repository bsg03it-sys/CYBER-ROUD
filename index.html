<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Suraksha Detective | साइबर सुरक्षा जासूस</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; }
    .screen-container { max-width: 440px; min-height: 720px; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-2 text-slate-100">

  <div class="screen-container w-full bg-slate-900 border-4 border-slate-700 rounded-3xl overflow-hidden shadow-2xl flex flex-col relative">
    
    <!-- Phone Top Bar -->
    <div class="bg-slate-950 px-5 py-2 flex justify-between items-center text-xs text-slate-400 border-b border-slate-800">
      <span id="clock">12:30</span>
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-battery-full text-emerald-400"></i>
      </div>
    </div>

    <!-- Header Score Bar -->
    <div class="bg-indigo-950/80 p-3 flex justify-between items-center border-b border-indigo-900/50">
      <div class="flex items-center space-x-2">
        <span class="bg-indigo-600 text-white text-xs font-bold px-2.5 py-1 rounded-full">Level <span id="currentLevel">1</span>/5</span>
      </div>
      <div class="text-right">
        <span class="text-xs text-indigo-300">स्कोर (Score):</span>
        <span id="score" class="font-extrabold text-amber-400 text-base ml-1">0</span>
      </div>
    </div>

    <!-- Dynamic Game Screen -->
    <div id="gameCard" class="flex-1 p-4 flex flex-col justify-between overflow-y-auto">
      <!-- Dynamic Content Loaded By JS -->
    </div>

    <!-- Feedback Modal / Overlay -->
    <div id="resultModal" class="hidden absolute inset-0 bg-slate-950/95 p-5 flex flex-col justify-center items-center text-center z-50">
      <div id="modalIcon" class="text-6xl mb-3"></div>
      <h3 id="modalTitle" class="text-xl font-bold mb-2"></h3>
      <p id="modalDesc" class="text-sm text-slate-300 mb-5 leading-relaxed"></p>
      <div class="w-full bg-slate-900 p-3 rounded-xl border border-slate-800 text-xs text-left mb-5">
        <span class="font-bold text-amber-400 block mb-1">🚨 सुरक्षा नियम (Cyber Tip):</span>
        <p id="modalTip" class="text-slate-300"></p>
      </div>
      <button onclick="nextScenario()" id="modalBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold text-white shadow-lg transition">अगला केस देखें (Next)</button>
    </div>

    <!-- Final Finish Screen -->
    <div id="finishScreen" class="hidden absolute inset-0 bg-slate-950 p-6 flex flex-col justify-center items-center text-center z-50">
      <div class="w-20 h-20 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-4xl mb-4 border border-emerald-500/50">
        🏆
      </div>
      <h2 class="text-2xl font-black text-white mb-1">ट्रेनिंग पूरी हुई!</h2>
      <p class="text-sm text-slate-400 mb-4">Cyber Detective Badge Awarded</p>
      <div class="bg-slate-900 p-4 rounded-2xl w-full border border-slate-800 mb-6">
        <p class="text-xs text-slate-400">कुल स्कोर (Total Score)</p>
        <p id="finalScore" class="text-4xl font-extrabold text-amber-400 my-1">0 / 50</p>
        <p id="badgeText" class="text-xs font-semibold text-emerald-400"></p>
      </div>
      <div class="text-left w-full bg-amber-950/30 border border-amber-800/40 p-3 rounded-xl text-xs text-amber-200 mb-6">
        <p class="font-bold mb-1">📞 हमेशा याद रखें:</p>
        <p>किसी भी ऑनलाइन धोखाधड़ी की शिकायत <b>1930</b> डायल करके या <b>cybercrime.gov.in</b> पर दर्ज कराएँ।</p>
      </div>
      <button onclick="restartGame()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-white transition">दोबारा खेलें (Restart)</button>
    </div>

  </div>

  <script>
    const scenarios = [
      {
        type: "gaming",
        sender: "UNKNOWN (+91 98XXX-XXXXX)",
        appName: "WhatsApp Message",
        appIcon: "fa-brands fa-whatsapp text-emerald-500",
        message: "🎉 बधाई! आपको Free Fire & BGMI में 5,000 मुफ़्त Diamonds/UC मिले हैं! तुरंत क्लेम करने के लिए नीचे लिंक खोलें और अपनी Free Fire ID से लॉगिन करें:",
        link: "http://free-diamonds-bonus.xyz/login",
        isFraud: true,
        correctReason: "यह Phishing लिंक है! अनजान लिंक और .xyz साइट्स आपकी गेम आईडी और पासवर्ड चुरा लेती हैं। मुफ़्त के लालच में कभी क्लिक न करें।",
        rule: "गेम कंपनियाँ कभी भी WhatsApp पर मुफ़्त डायमंड्स का लिंक नहीं भेजतीं।"
      },
      {
        type: "bank",
        sender: "VK-SBINB (SMS)",
        appName: "Messages (SMS)",
        appIcon: "fa-solid fa-comment-sms text-sky-400",
        message: "चेतावनी: आपका बैंक खाता / SIM कार्ड 2 घंटे में बंद कर दिया जाएगा। तुरंत PAN/Aadhaar अपडेट करने के लिए यहाँ क्लिक करें:",
        link: "https://sbi-kyc-verify-urgent.top",
        isFraud: true,
        correctReason: "धोखेबाज़ 'डर और हड़बड़ी' पैदा करते हैं ताकि आप बिना सोचे-समझे फ़र्ज़ी लिंक पर बैंक या आधार विवरण डाल दें।",
        rule: "बैंक कभी भी SMS में लिंक भेजकर KYC या आधार अपडेट करने को नहीं कहता।"
      },
      {
        type: "lottery",
        sender: "KBC Lucky Winner",
        appName: "WhatsApp Notification",
        appIcon: "fa-brands fa-whatsapp text-emerald-500",
        message: "🏆 KBC लॉटरी विभाग: आपका नंबर ₹25,00,000 की लॉटरी में चुना गया है! राशि अपने खाते में पाने के लिए ₹500 प्रोसेसिंग फ़ीस इस QR कोड पर ट्रांसफर करें।",
        link: "Pay ₹500 Registration Fee",
        isFraud: true,
        correctReason: "अगर आपने कोई लॉटरी टिकट ही नहीं खरीदा तो लॉटरी कैसे लगेगी? असली इनाम पाने के लिए पहले कभी पैसे नहीं देने पड़ते।",
        rule: "इनाम के नाम पर पहले पैसे या OTP माँगना 100% फ़्रॉड की पहचान है।"
      },
      {
        type: "friend",
        sender: "School Friend (Rohit)",
        appName: "Instagram / Chat",
        appIcon: "fa-brands fa-instagram text-pink-500",
        message: "भाई मैं हॉस्पिटल में बहुत बड़ी मुसीबत में हूँ! मेरा फ़ोन पे नहीं चल रहा। इस QR पर तुरंत ₹2000 भेज दे, मैं कल सुबह पक्का वापस कर दूँगा। प्लीज कॉल मत करना, डॉक्टर मना कर रहे हैं।",
        link: "Scan & Pay Fast",
        isFraud: true,
        correctReason: "हैकर्स दोस्तों की प्रोफ़ाइल की नकल करके इमरजेंसी का बहाना बनाते हैं और कॉल करने से मना करते हैं।",
        rule: "पैसे भेजने से पहले हमेशा दोस्त या उसके परिवार को असली फ़ोन कॉल लगाकर सच जानें।"
      },
      {
        type: "wifi",
        sender: "Wi-Fi Settings",
        appName: "Public Wi-Fi Login",
        appIcon: "fa-solid fa-wifi text-amber-400",
        message: "रेलवे स्टेशन पर 'FREE_HIGH_SPEED_WIFI' मिला। कनेक्ट करने के लिए अपना Google ईमेल, पासवर्ड और फ़ोन गैलरी एक्सेस की अनुमति दें।",
        link: "Connect & Grant Permission",
        isFraud: true,
        correctReason: "हैकर्स सार्वजनिक जगहों पर फ़र्ज़ी फ़्री वाई-फ़ाई बनाकर फ़ोन का पूरा डेटा और पासवर्ड हैक कर लेते हैं।",
        rule: "फ़्री वाई-फ़ाई के लिए कभी पासवर्ड या गैलरी परमिशन न दें।"
      }
    ];

    let currentIdx = 0;
    let score = 0;

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    }
    setInterval(updateClock, 1000);
    updateClock();

    function renderScenario() {
      const s = scenarios[currentIdx];
      document.getElementById('currentLevel').innerText = currentIdx + 1;
      
      const card = document.getElementById('gameCard');
      card.innerHTML = `
        <div class="bg-slate-800/90 rounded-2xl p-4 border border-slate-700/80 shadow-md">
          <div class="flex items-center space-x-2 text-xs text-slate-300 mb-2 border-b border-slate-700 pb-2">
            <i class="${s.appIcon} text-base"></i>
            <span class="font-bold">${s.appName}</span>
            <span class="text-slate-500 text-[10px] ml-auto">${s.sender}</span>
          </div>
          <p class="text-sm text-slate-100 leading-relaxed mb-3">${s.message}</p>
          <div class="bg-slate-900 border border-indigo-500/40 rounded-lg p-2.5 text-center text-xs text-indigo-300 font-mono break-all cursor-pointer hover:bg-slate-950 transition">
            <i class="fa-solid fa-arrow-up-right-from-square mr-1 text-[10px]"></i> ${s.link}
          </div>
        </div>

        <div class="my-4 text-center">
          <p class="text-xs text-slate-400 uppercase tracking-widest font-bold">जासूस का फैसला (Your Action):</p>
          <p class="text-sm font-semibold text-white mt-1">क्या यह मैसेज असली है या फ़्रॉड?</p>
        </div>

        <div class="space-y-2.5">
          <button onclick="handleChoice(true)" class="w-full py-3 bg-rose-600 hover:bg-rose-500 active:scale-95 transition text-white rounded-xl font-bold flex items-center justify-center space-x-2 shadow-lg shadow-rose-950/40">
            <i class="fa-solid fa-shield-virus"></i>
            <span>यह फ़्रॉड है! लिंक मत खोलो (Scam)</span>
          </button>
          <button onclick="handleChoice(false)" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition text-white rounded-xl font-bold flex items-center justify-center space-x-2 shadow-lg shadow-emerald-950/40">
            <i class="fa-solid fa-check"></i>
            <span>यह सुरक्षित है, क्लिक करो (Safe)</span>
          </button>
        </div>
      `;
    }

    function handleChoice(userSaidFraud) {
      const s = scenarios[currentIdx];
      const isCorrect = (userSaidFraud === s.isFraud);
      const modal = document.getElementById('resultModal');
      const icon = document.getElementById('modalIcon');
      const title = document.getElementById('modalTitle');
      const desc = document.getElementById('modalDesc');
      const tip = document.getElementById('modalTip');

      if (isCorrect) {
        score += 10;
        document.getElementById('score').innerText = score;
        icon.innerHTML = '<span class="text-emerald-400">🛡️</span>';
        title.innerText = "शाबाश! सही पकड़ा!";
        title.className = "text-xl font-bold text-emerald-400 mb-2";
        desc.innerText = "आप बिल्कुल सतर्क हैं! " + s.correctReason;
      } else {
        icon.innerHTML = '<span class="text-rose-500">⚠️</span>';
        title.innerText = "धोखा हो गया!";
        title.className = "text-xl font-bold text-rose-500 mb-2";
        desc.innerText = "अगर आपने इस पर क्लिक किया होता तो आपके अकाउंट/आईडी का नुकसान हो जाता। " + s.correctReason;
      }

      tip.innerText = s.rule;
      modal.classList.remove('hidden');
    }

    function nextScenario() {
      document.getElementById('resultModal').classList.add('hidden');
      currentIdx++;
      if (currentIdx < scenarios.length) {
        renderScenario();
      } else {
        showFinalScreen();
      }
    }

    function showFinalScreen() {
      const finish = document.getElementById('finishScreen');
      document.getElementById('finalScore').innerText = `${score} / 50`;
      const badge = document.getElementById('badgeText');
      
      if (score >= 40) {
        badge.innerText = "🏅 मास्टर साइबर जासूस (Super Cyber Safe)";
      } else if (score >= 20) {
        badge.innerText = "🥈 सतर्क नागरिक (Needs More Alertness)";
      } else {
        badge.innerText = "⚠️ थोड़ा और सतर्क रहने की ज़रूरत है";
      }
      finish.classList.remove('hidden');
    }

    function restartGame() {
      currentIdx = 0;
      score = 0;
      document.getElementById('score').innerText = 0;
      document.getElementById('finishScreen').classList.add('hidden');
      renderScenario();
    }

    renderScenario();
  </script>
</body>
</html>
